# team/members.conf — 팀 구성. 대상 프로젝트에 team/members.conf가 있으면 이 파일 대신 그 파일만 읽는다.
# 빈 줄과 #으로 시작하는 줄은 무시한다. 파싱 규칙은 lib/setup-common.sh에 있다.
# 새 역할의 스킬·플러그인 배분은 config.claude.sh·config.codex.sh에 추가한다.

# tmux 세션 이름 (필수)
SESSION=team1

# role|model|effort — 줄 순서가 곧 파인 배치 순서다.
# 구분자 |는 항상 두 개다. effort 외 필드가 비어 있거나 형식이 틀리면 경고를 출력하고 실행을 멈춘다.
#   - role: say 주소·파일명·디렉토리명에 쓰이는 직무 키.
#   - model: 전체 모델 ID(필수). 공급자는 접두사로 정한다(claude-* → claude, gpt-* → codex).
#   - effort: low/medium/high/xhigh/max. 비우면(예: lead|claude-sonnet-5-5|) CLI 기본값을 쓴다.
lead|claude-sonnet-5-5|high
architect|gpt-6.1-sol|high
uiux|gpt-6.1-terra|medium
frontend|claude-sonnet-5-5|medium
backend|claude-sonnet-5-5|medium
reviewer|gpt-6.1-sol|medium
