  <text x="640" y="70" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#6b665c">claude-sonnet-5 · 직접 작업 금지</text>

  <!-- trunk + bus -->
  <line x1="640" y1="88" x2="640" y2="118" stroke="#262420" stroke-width="1.5"/>
  <line x1="150" y1="118" x2="1130" y2="118" stroke="#262420" stroke-width="1.5"/>

