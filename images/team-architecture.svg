  <text x="885" y="404" text-anchor="middle" font-size="10.5" fill="#262420">test-driven-development</text>
  <text x="885" y="419" text-anchor="middle" font-size="10.5" fill="#262420">systematic-debugging · receiving-review</text>

  <rect x="1025" y="280" width="210" height="150" rx="6" fill="#edeae3" stroke="#d8d3c8" stroke-width="1"/>
  <text x="1130" y="298" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#6b665c" letter-spacing="0.06em">DOMAIN</text>
  <text x="1130" y="314" text-anchor="middle" font-size="11" fill="#262420">리뷰 · 보안 · 커버리지</text>
