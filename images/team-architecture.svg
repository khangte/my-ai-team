  <text x="885" y="298" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#6b665c" letter-spacing="0.06em">DOMAIN</text>
  <text x="885" y="314" text-anchor="middle" font-size="11" fill="#262420">구현 · 버그수정 · DB · 배포스크립트</text>
