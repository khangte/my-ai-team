  <text x="150" y="336" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#6b665c" letter-spacing="0.06em">GSTACK</text>
  <text x="150" y="351" text-anchor="middle" font-size="10.5" fill="#262420">spec · diagram · document-generate</text>
  <text x="150" y="366" text-anchor="middle" font-size="10.5" fill="#262420">health · plan-eng-review</text>
  <text x="150" y="388" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#6b665c" letter-spacing="0.06em">SUPERPOWERS</text>
  <text x="150" y="404" text-anchor="middle" font-size="10.5" fill="#262420">brainstorming</text>
  <text x="150" y="419" text-anchor="middle" font-size="10.5" fill="#262420">writing-plans</text>

  <rect x="290" y="280" width="210" height="150" rx="6" fill="#edeae3" stroke="#d8d3c8" stroke-width="1"/>
  <text x="395" y="298" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#6b665c" letter-spacing="0.06em">DOMAIN</text>
  <text x="395" y="314" text-anchor="middle" font-size="11" fill="#262420">조사 · 비교분석 · 레퍼런스</text>
  <text x="395" y="336" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#6b665c" letter-spacing="0.06em">GSTACK</text>
