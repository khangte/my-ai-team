<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 515" font-family="Georgia, 'Iowan Old Style', serif" role="img" aria-label="lead 파인이 맨 위에서 5개 역할 파인(architect, researcher, designer, developer, reviewer)에게 작업을 배분하고 보고를 받는 구조. reviewer는 코드 품질 수정요청을 developer에게 직행으로 보내고, developer/designer/reviewer는 설계 판단이 필요할 때(설계 이탈, 설계 정합성 위반 등) architect를 경유한다.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#262420" />
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8375" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b5502e" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="515" fill="#f6f5f2"/>

